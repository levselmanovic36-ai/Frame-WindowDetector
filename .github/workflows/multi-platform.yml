name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: v5.10.5
          build-config: Release

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Frame Window Detector Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
